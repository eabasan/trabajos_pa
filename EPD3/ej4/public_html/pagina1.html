<html>
    <head>
        <title>Ejercicio 4 - Pagina 1</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: #E9F1FA;
                color: #333333;
                margin: 0;
                padding: 40px 20px;
            }
            #contenedor {
                max-width: 550px;
                margin: 0 auto;
                background-color: #FFFFFF;
                border-radius: 8px;
                padding: 30px;
                text-align: center;
                border: 1px solid #D9E2EC;
            }
            h1 {
                color: #213F99;
                margin-top: 0;
                margin-bottom: 15px;
            }
            .fuente {
                font-size: 0.9em;
                color: #555555;
                margin-bottom: 25px;
                background-color: #F8FAFC;
                padding: 12px;
                border-left: 4px solid #213F99;
                border-radius: 4px;
                text-align: left;
            }
            .fuente a {
                color: #213F99;
                text-decoration: none;
                font-weight: bold;
            }

            .fuente a:hover {
                text-decoration: underline;
            }
            .caja_color {
                width: 100%;
                height: 160px;
                border-radius: 6px;
                background-color: #213F99;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #FFFFFF;
                font-size: 1.8em;
                font-weight: bold;
                margin-bottom: 25px;
                box-sizing: border-box;
                border: 2px solid #D9E2EC;
            }
            button {
                background-color: #213F99;
                color: #FFFFFF;
                border: none;
                padding: 12px 24px;
                font-size: 1em;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            button:hover {
                background-color: #001F66;
            }

            button:active {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <main id="contenedor">
            <h1>Generador de Colores Aleatorios</h1>
            <aside class="fuente">
                <strong>Snippet utilizado: </strong> How To Generate a Random Color in JavaScript<br>
                <strong>URL: </strong><a href="https://css-tricks.com/snippets/javascript/random-hex-color/" target="_blank">Enlace</a>
            </aside>
            <p id="muestra" class="caja_color">#213F99</p>

            <button type="button" onclick="setBg()">Generar nuevo color</button>
        </main>

        <script>
            function setBg() {
                var randomColor = Math.floor(Math.random() * 16777215).toString(16);
                document.getElementById("muestra").style.backgroundColor = "#" + randomColor;
                document.getElementById("muestra").innerHTML = "#" + randomColor;
            }
        </script>
    </body>
</html>
