<html>
    <head>
        <title>Ejercicio 4 - Pagina 2</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                background-color: #E9F1FA;
                color: #333333;
                margin: 0;
                padding: 40px 20px;
            }

            #contenedor {
                max-width: 600px;
                margin: 0 auto;
                background-color: #FFFFFF;
                border: 1px solid #D9E2EC;
                border-radius: 8px;
                padding: 30px;
            }

            h1 {
                color: #213F99;
                margin-top: 0;
                margin-bottom: 15px;
                text-align: center;
            }
            .fuente {
                font-size: 0.9em;
                color: #555555;
                margin-bottom: 25px;
                background-color: #F8FAFC;
                padding: 12px;
                border-left: 4px solid #213F99;
                border-radius: 4px;
                text-align: left;
            }

            .fuente a {
                color: #213F99;
                text-decoration: none;
                font-weight: bold;
            }

            .fuente a:hover {
                text-decoration: underline;
            }

            label {
                display: block;
                font-weight: bold;
                margin-bottom: 6px;
                color: #213F99;
            }

            textarea {
                width: 100%;
                height: 100px;
                padding: 10px;
                border: 1px solid #B0BEC5;
                border-radius: 4px;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 0.95em;
                resize: vertical;
            }

            textarea:focus {
                outline: 2px solid #213F99;
                background-color: #FAFCFE;
            }

            .boton_contenedor {
                text-align: center;
                margin: 20px 0;
            }

            button {
                background-color: #213F99;
                color: #FFFFFF;
                border: none;
                padding: 10px 20px;
                font-size: 1em;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

            button:hover {
                background-color: #001F66;
            }

            #resultado {
                display: block;
                background-color: #F8FAFC;
                border: 1px dashed #213F99;
                border-radius: 4px;
                padding: 12px;
                min-height: 50px;
                box-sizing: border-box;
                white-space: pre-wrap;
                word-break: break-word;
            }
        </style>
    </head>
    <body>
        <main id="contenedor">
            <h1>Eliminar Etiquetas HTML</h1>
            <aside class="fuente">
                <strong>Snippet utilizado: </strong> Strip HTML Tags in JavaScript<br>
                <strong>URL: </strong><a href="https://css-tricks.com/snippets/javascript/strip-html-tags-in-javascript/" target="_blank">Enlace</a>
            </aside>
            <p>
                <label for="texto_origen">Texto con HTML:</label>
                <textarea id="texto_origen" placeholder="Escribe o pega aqu&iacute; tu texto con etiquetas HTML (ej: <p>Hola <b>mundo</b></p>)..."></textarea>
            </p>
            <p class="boton_contenedor">
                <button type="button" onclick="limpiarEtiquetas()">Limpiar texto</button>
            </p>

            <p>
                <label for="resultado">Resultado limpio (texto plano):</label>
                <output id="resultado">Pulsa el bot&oacute;n para ver el texto sin etiquetas</output>
            </p>
        </main>

        <script>
            function limpiarEtiquetas() {
                var originalString = document.getElementById("texto_origen").value;

                let strippedString = originalString.replace(/(<([^>]+)>)/gi, "");

                document.getElementById("resultado").textContent = strippedString;
            }
        </script>
    </body>
</html>
