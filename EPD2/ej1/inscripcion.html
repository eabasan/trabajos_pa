<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripci&oacute;n al Evento - Jornadas de Empleo</title>
    <link rel="stylesheet" type="text/css" href="estilo_padre.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Inscripci&oacute;n al Evento</h1>
            <p>Formulario de registro para asistentes</p>
        </header>

        <!-- Columna 1: Menú de navegación principal (Izquierda) -->
        <nav class="column col-nav" aria-label="Men&uacute; principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="programa.html">Programa</a></li>
                <li><a href="actividades.html">Actividades</a></li>
                <li><a href="ponentes.html">Ponentes</a></li>
                <li><a href="asociaciones.html">Asociaciones</a></li>
                <li><a href="multimedia.html">Multimedia</a></li>
                <li><a href="inscripcion.html">Inscripci&oacute;n</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>

        <!-- Columna 2: Contenido principal con formulario de registro (Derecha) -->
        <main class="column col-main">
            <section>
                <h2>Datos de Registro</h2>
                <form action="#" method="post" enctype="multipart/form-data">
                    <p>
                        <label for="nombre">Nombre completo:</label><br>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre y apellidos">
                    </p>

                    <p>
                        <label for="email">Correo institucional:</label><br>
                        <input type="email" id="email" name="email" required placeholder="usuario@upo.es">
                    </p>

                    <p>
                        <label for="fecha">Fecha de asistencia:</label><br>
                        <input type="date" id="fecha" name="fecha" required>
                    </p>

                    <p>
                        <label for="experiencia">Nivel de experiencia previa (0-10):</label><br>
                        <input type="range" id="experiencia" name="experiencia" min="0" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
                        <output>5</output>
                    </p>

                    <p>
                        <label for="cv">Adjuntar CV (.pdf):</label><br>
                        <input type="file" id="cv" name="cv" accept=".pdf" required>
                    </p>

                    <p>
                        <label>
                            <input type="checkbox" name="terminos" value="acepta" required> Acepto los t&eacute;rminos de participaci&oacute;n
                        </label>
                    </p>

                    <p>
                        <button type="submit">Completar inscripci&oacute;n</button>
                    </p>
                </form>
            </section>
        </main>

        <!-- Pie de página fijado abajo con clear: both -->
        <footer>
            <p>&copy; UPO - 2026</p>
        </footer>
    </div>
</body>
</html>
