<!DOCTYPE html>
<html lang="es">
<head>
    <title>Evento Universitario</title>
</head>
<body>
    <header>
        <style>
            body{
                background-color: #f4f4f9;
                font-family: Arial, sans-serif;
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            nav{
                background-color: #333333;
                overflow: hidden;
            }
            
            nav ul{
                list-style-type: none;
                margin: 0;
                padding: 0;
            }
            
            nav li{
                float: left;
            }
            
            nav li a{
                display: block;
                color: white;
                text-align: center;
                text-decoration: none;
                padding: 14px 20px;
            }
            
            nav li a:hover{
                background-color: #555555;
            }
            
            form{
                width: 90%;
                max-width: 400px;
                margin: 50px auto;
                background-color: #ffffff;
                padding: 30px;
            }
            
            input[type="email"], 
            input[type="password"] {
                width: 100%;
                font-size: 18px;
                padding: 10px; 
                margin-top: 5px;
                margin-bottom: 15px;
                box-sizing: border-box;
            }
            
            button {
                width: 100%;
                font-size: 18px;
                padding: 10px;
                background-color: #0056b3;
                color: white;
            }
            
            button:hover{
                background-color:#003366;
            }
            
            label{
                font-size: 18px;
                display: block;
                margin-bottom: 5px;
            }
            
        </style>
        
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="programa.html">Programa</a></li>
                <li><a href="actividades.html">Actividades</a></li>
                <li><a href="ponentes.html">Ponentes</a></li>
                <li><a href="asociaciones.html">Asociaciones</a></li>
                <li><a href="multimedia.html">Multimedia</a></li>
                <li><a href="inscripcion.html">Inscripci&oacute;n</a></li>
                <li><a href="noticias.html">Noticias</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section>
            <form action="index.html" method="GET">
                <fieldset>
                    <legend>Datos de acceso</legend>
                    <label for="usuario">Correo electr&oacute;nico:</label>
                    <input type="email" id="usuario" name="usuario" placeholder="alumno@alu.upo.es" required><br>
                    <label for="contraseña">Contrase&ntilde;a:</label>
                    <input type="password" id="contraseña" placeholder="Introduce la contrase&ntilde;a" required>
                    <br></br>
                    <button type="submit">Enviar</button>
                </fieldset>
            </form>
        </section>
    </main>
    
    <footer>
        <p>Organizaci&oacute;n del evento de ponencias y empleo</p>
    </footer>
</body>
</html>
