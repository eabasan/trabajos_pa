                <div class="columnacontenido">
                    <section>
                        <h2>Formulario de Inscripci&oacute;n</h2>

                        <form action="index.html" method="GET">
                            <fieldset>
                                <legend>Datos Personales y Acad&eacute;micos</legend>

                                <label for="nombre">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" required>
                                <br><br>

                                <label for="apellidos">Apellidos:</label>
                                <input type="text" id="apellidos" name="apellidos" required>
                                <br><br>

                                <label for="correo">Correo electr&oacute;nico:</label>
                                <input type="email" id="correo" name="correo" required>
                                <br><br>

                                <!-- Aquí entra la magia del datalist de HTML5 -->
                                <label for="titulacion">Titulaci&oacute;n o Facultad:</label>
                                <input list="grados" id="titulacion" name="titulacion" placeholder="Escribe o selecciona..." required>

                                <datalist id="grados">
                                    <option value="Ingenier&iacute;a Inform&aacute;tica">
                                    <option value="Administraci&oacute;n y Direcci&oacute;n de Empresas">
                                    <option value="Derecho">
                                    <option value="Comunicaci&oacute;n Audiovisual">
                                </datalist>
                                <br><br>

                                <button type="submit">Enviar Inscripci&oacute;n</button>
                            </fieldset>
                        </form>
                    </section>
