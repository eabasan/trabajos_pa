        <main>
            <section>
                <h2>Iniciar Sesión</h2>
                <form action="#">
                    <fieldset>
                        <legend>Acceso para Usuarios Registrados</legend>
                        <p>
                            <label for="email">Correo electrónico:</label><br>
                            <input type="email" id="email" name="email_control" autofocus required placeholder="ejemplo@upo.es">
                        </p>
                        <p>
                            <label for="clave">Contraseña:</label><br>
                            <input type="password" id="clave" name="pass_control" required minlength="6" placeholder="Mínimo 6 caracteres">
                        </p>
                        <p>
                            <input type="submit" value="Entrar">
                            <input type="reset" value="Limpiar">
                        </p>
                    </fieldset>
                </form>
